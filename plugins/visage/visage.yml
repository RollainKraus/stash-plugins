name: Visage
# requires: CommunityScriptsUILibrary
description: Use facial Recognition To Lookup Performers. Roughly patched and uses marquee selection instead of face detection
version: 2.0.3
ui:
  requires:
    - CommunityScriptsUILibrary
  javascript:
    - visage.js
    - visage-marquee.js
  css:
    - visage.css
  csp:
    connect-src:
      - "https://cc1234-stashface.hf.space"
    script-src:
      - "https://cdn.jsdelivr.net/npm/@gradio/client@1.15.3/dist/index.js"
settings:
  floatingImageButton:
    displayName: Floating Image Button
    type: BOOLEAN
    description: Adds a small fixed Visage button in the bottom-right corner on image pages for theme compatibility. Default false.
