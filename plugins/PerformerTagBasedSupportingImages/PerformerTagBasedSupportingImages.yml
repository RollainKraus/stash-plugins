name: Performer Tag Based Supporting Images
description: Supporting performer images selected by performer plus slot tag rules
version: 2.2.0
url: https://github.com/RollainKraus/stash-plugins

settings:
  a_selectionMode:
    displayName: Image Selection Mode
    type: STRING
    description: "How each slot chooses among multiple matches: first or random (Default: first)"

  a_slotSlideshowSeconds:
    displayName: Slot Slideshow Seconds
    type: STRING
    description: "0 disables. 1+ enables slot slideshows (Default: 0)"

  a_slotTransitionMs:
    displayName: Slot Transition Milliseconds
    type: STRING
    description: "0 disables. Transition duration in milliseconds (Default: 0)"

  a_loopSlots:
    displayName: Loop Slots
    type: BOOLEAN
    description: "Repeat slots for infinite scrolling behavior (Default: true)"

  a_defaultPanelState:
    displayName: Panel State Behavior
    type: STRING
    description: "expanded, collapsed, or remember last state (Default: remember; falls back to expanded if no saved state exists)"

  a_slotInfoPosition:
    displayName: Slot Info Position
    type: STRING
    description: "Whether the tag label row is shown at the top or bottom of the slot: top or bottom (Default: top)"

  a_imageHeight:
    displayName: Minimum Slot Height
    type: STRING
    description: "Sets the minimum height of slots and influences how tall slots can grow (Default: 210)"

  a_panelWidth:
    displayName: Panel Width
    type: STRING
    description: "Panel width in pixels for the performer page panel (Default: 300)"

  a_autoFitSlotCrops:
    displayName: Auto Fit Slot Crops
    type: BOOLEAN
    description: "Automatically fit images to their slot aspect ratio (Default: true)"

  a_panelBackgroundColor:
    displayName: Background Panel Color
    type: STRING
    description: "Background color for the slot header/footer panels (Default: #808080)"

  a_panelOpacity:
    displayName: Background Panel Opacity
    type: STRING
    description: "Background opacity for the slot header/footer panels from 0 to 1 (Default: 0.1)"

  a_overlayBackgroundColor:
    displayName: Buttons/Labels Background Color
    type: STRING
    description: "Background color for buttons and labels (Default: #808080)"

  a_overlayBackgroundOpacity:
    displayName: Buttons/Labels Background Opacity
    type: STRING
    description: "Background opacity for buttons and labels from 0 to 1 (Default: 0.3)"

  a_overlayFontColor:
    displayName: Buttons/Labels Font Color
    type: STRING
    description: "Text and icon color for buttons and labels (Default: #ffffff)"

  a_overlayFontSize:
    displayName: Buttons/Labels Font Size
    type: STRING
    description: "Font size in pixels for buttons and labels (Default: 13)"

  a_openInNewTab:
    displayName: Open Images In New Tab
    type: BOOLEAN
    description: "Open the image page in a new tab when clicking a supporting image (Default: true)"

  a_cardPreviewHoverBehavior:
    displayName: Performer Card Preview Hover Behavior
    type: STRING
    description: "How the performer card preview opens: performer card, badge, or disabled (Default: badge)"

  a_cardPreviewPanelWidth:
    displayName: Performer Card Preview Width
    type: STRING
    description: "Width in pixels for the hover preview panel shown on performer cards (Default: 500)"

  a_cardPreviewPanelHeight:
    displayName: Performer Card Preview Height
    type: STRING
    description: "Height in pixels for the hover preview panel shown on performer cards (Default: 500)"

  a_cardPreviewBackgroundColor:
    displayName: Performer Card Preview Background Color
    type: STRING
    description: "Background color for the hover preview panel shown on performer cards (Default: #000000)"

  a_cardPreviewShowEmptySlots:
    displayName: Show Empty Preview Slots
    type: BOOLEAN
    description: "Show blank placeholders for missing performer card preview slots so slot order and gaps stay visible (Default: false)"

  a_cardPreviewSlotOrder:
    displayName: Performer Card Preview Slot Order
    type: STRING
    description: "Six digits using each slot number once to control preview order, for example 123456 or 145623 (Default: 123456)"

  b_slot1Tags:
    displayName: Slot 1 Tags
    type: STRING
    description: "Comma-separated tag names required for slot 1 matches (Default: empty)"

  c_slot1Label:
    displayName: Slot 1 Label
    type: STRING
    description: "Custom label for slot 1 (Default: tag names)"

  c1_slot1IncludeSubTags:
    displayName: Slot 1 Include Sub Tags
    type: BOOLEAN
    description: "When enabled, slot 1 also matches descendant tags of the listed tags (Default: false)"

  d_slot2Tags:
    displayName: Slot 2 Tags
    type: STRING
    description: "Comma-separated tag names required for slot 2 matches (Default: empty)"

  e_slot2Label:
    displayName: Slot 2 Label
    type: STRING
    description: "Custom label for slot 2 (Default: tag names)"

  e1_slot2IncludeSubTags:
    displayName: Slot 2 Include Sub Tags
    type: BOOLEAN
    description: "When enabled, slot 2 also matches descendant tags of the listed tags (Default: false)"

  f_slot3Tags:
    displayName: Slot 3 Tags
    type: STRING
    description: "Comma-separated tag names required for slot 3 matches (Default: empty)"

  g_slot3Label:
    displayName: Slot 3 Label
    type: STRING
    description: "Custom label for slot 3 (Default: tag names)"

  g1_slot3IncludeSubTags:
    displayName: Slot 3 Include Sub Tags
    type: BOOLEAN
    description: "When enabled, slot 3 also matches descendant tags of the listed tags (Default: false)"

  h_slot4Tags:
    displayName: Slot 4 Tags
    type: STRING
    description: "Comma-separated tag names required for slot 4 matches (Default: empty)"

  i_slot4Label:
    displayName: Slot 4 Label
    type: STRING
    description: "Custom label for slot 4 (Default: tag names)"

  i1_slot4IncludeSubTags:
    displayName: Slot 4 Include Sub Tags
    type: BOOLEAN
    description: "When enabled, slot 4 also matches descendant tags of the listed tags (Default: false)"

  j_slot5Tags:
    displayName: Slot 5 Tags
    type: STRING
    description: "Comma-separated tag names required for slot 5 matches (Default: empty)"

  k_slot5Label:
    displayName: Slot 5 Label
    type: STRING
    description: "Custom label for slot 5 (Default: tag names)"

  k1_slot5IncludeSubTags:
    displayName: Slot 5 Include Sub Tags
    type: BOOLEAN
    description: "When enabled, slot 5 also matches descendant tags of the listed tags (Default: false)"

  l_slot6Tags:
    displayName: Slot 6 Tags
    type: STRING
    description: "Comma-separated tag names required for slot 6 matches (Default: empty)"

  m_slot6Label:
    displayName: Slot 6 Label
    type: STRING
    description: "Custom label for slot 6 (Default: tag names)"

  m1_slot6IncludeSubTags:
    displayName: Slot 6 Include Sub Tags
    type: BOOLEAN
    description: "When enabled, slot 6 also matches descendant tags of the listed tags (Default: false)"

ui:
  javascript:
    - PerformerTagBasedSupportingImages.js
  css:
    - PerformerTagBasedSupportingImages.css
