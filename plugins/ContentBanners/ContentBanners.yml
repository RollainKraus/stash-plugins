name: Content Banners
description: Adds configurable scene preview banners to Stash detail pages.
version: 2.4.0
ui:
  css:
    - ContentBanners.css
  javascript:
    - ContentBanners.js
settings:
  bannerContentTypes:
    displayName: Banner Content Type and Count
    type: STRING
    description: Comma-separated content types and banner counts. Omit a type to disable banners there. Supports studio, performer, group, and tag with counts from 1 to 3. Example studio:3,performer:1,groups:3,tag:2. Default studio:2,performer:2,groups:2,tag:2.
  bannerMode:
    displayName: Banner Mode
    type: STRING
    description: preview, screenshot, or mixed. Preview uses generated scene preview videos. Screenshot uses still images. Mixed prefers preview and falls back to screenshot. Default mixed.
  selectionMode:
    displayName: Selection Mode
    type: STRING
    description: random, highest rating, most recent releases, or recently added. Modes with no matching scenes fall back to random. Default random.
  resultLimit:
    displayName: Result Limit
    type: NUMBER
    description: Number of scenes to load for each banner pool. Default 40.
  rotationSeconds:
    displayName: Rotation Seconds
    type: NUMBER
    description: Seconds before switching to another banner item. Default 12.
  transitionMs:
    displayName: Transition Milliseconds
    type: NUMBER
    description: Crossfade duration in milliseconds. Default 700.
  bannerAdjustments:
    displayName: Banner Adjustments
    type: STRING
    description: Comma-separated overlay opacity, brightness, saturation, blur values from 0.0 to 1.0. Example 0.38,0.62,1.0,0.0 means 38% dark overlay, 62% brightness, full saturation, no blur. Blur maps 0.0-1.0 to 0-16px. Default 0.38,0.62,1.0,0.0.
  bannerObjectPosition:
    displayName: Banner Object Position
    type: STRING
    description: CSS object-position for banner media. Use values like center 18%, center 35%, or center top to shift the cropped banner view. Default center 18%.
  showTitle:
    displayName: Show Scene Title
    type: BOOLEAN
    description: Show clickable scene title badges when hovering over the banner. Default true.
  showControls:
    displayName: Show Floating Controls
    type: BOOLEAN
    description: Show draggable media controls on pages with active banners. Controls include previous, next, play/pause, 1 second seek, and speed adjustment. Default true.
