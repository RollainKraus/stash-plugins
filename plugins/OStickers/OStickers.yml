name: O Stickers
description: Randomly overlays O-count stickers or emoji on scene, image, studio, performer, and group cards.
version: 1.4.27
ui:
  css:
    - OStickers.css
  javascript:
    - OStickers.js
  assets:
    /: assets
settings:
  maxStickers:
    displayName: Max Stickers
    type: NUMBER
    description: Maximum number of overlays to render per card. Default 50.
  stickersPerOCount:
    displayName: Stickers Per O Count
    type: NUMBER
    description: Multiplier for repeat, incremental, and thresholds modes. Single mode still renders one sticker. Default 1.
  mode:
    displayName: Mode
    type: STRING
    description: repeat, incremental, single, or thresholds. Default incremental.
  emoji:
    displayName: Emoji
    type: STRING
    description: Leave empty to use PNG files from the assets folder, or enter one emoji / a comma-separated emoji list to use emoji stickers. Default empty.
  imageMode:
    displayName: Image Mode
    type: STRING
    description: random or fixed. Applies to image stickers and emoji lists. Default random.
  sizePercent:
    displayName: Size Percent
    type: STRING
    description: Sticker size as a percentage of card width. Default 25.
  opacity:
    displayName: Opacity
    type: STRING
    description: Sticker opacity from 0 to 1. Default 0.3.
  animation:
    displayName: Animation
    type: STRING
    description: none, float, wiggle, pulse, or rain. Default none.
  animationSpeedMs:
    displayName: Animation Speed (ms)
    type: NUMBER
    description: Animation duration in milliseconds. Default 5000.
  allowOverflow:
    displayName: Allow Overflow
    type: BOOLEAN
    description: Allow stickers to overflow beyond card edges. Default true.
  hideOnHover:
    displayName: Hide On Hover
    type: BOOLEAN
    description: Hide stickers while hovering over a decorated card. Default false.
  maxOverflowPercent:
    displayName: Max Overflow Percent
    type: NUMBER
    description: Maximum percentage of a sticker that may sit outside a card edge when overflow is enabled. Default 50.
  renderAreaWidth:
    displayName: Render Area Width
    type: STRING
    description: Comma separated min,max card-width percentages for sticker centers. Example 10,90 keeps stickers right of 10% and left of 90%. Default 0,100.
  renderAreaHeight:
    displayName: Render Area Height
    type: STRING
    description: Comma separated min,max card-height percentages for sticker centers. Example 20,80 keeps stickers between 20% and 80% of card height. Default 0,100.
  thresholds:
    displayName: Thresholds
    type: STRING
    description: Comma separated O-count thresholds used by thresholds mode. Default 1,5,10,25,50.
  contentTypes:
    displayName: Content Types
    type: STRING
    description: Comma separated card types to decorate. Supports image,scene,studio,performer,group. Default image,scene,studio,performer,group.
  showOnHomePage:
    displayName: Show On Home Page
    type: BOOLEAN
    description: Decorate eligible cards on the Stash home page. Default false.
  showOnOtherPages:
    displayName: Show On Other Pages
    type: BOOLEAN
    description: Decorate eligible cards outside the main scene, image, performer, studio, and group browser pages. Includes embedded content cards when enabled by Content Types. Default false.
  showToggleButton:
    displayName: Show Header Toggle Button
    type: BOOLEAN
    description: Show the header button for quickly toggling stickers on or off. Default true.
