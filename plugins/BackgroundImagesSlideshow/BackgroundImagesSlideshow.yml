name: "Plugin: Background Images Slideshow"
description: "Displays randomized background images with optional slideshow cycling, crossfades, and column layouts."
version: 1.1.0
ui:
  css:
    - BackgroundImagesSlideshow.css
  javascript:
    - BackgroundImagesSlideshow.js
settings:
  id:
    displayName: Global Background Source ID
    description: ID of the tag or gallery containing the global background images.
    type: NUMBER
  mode:
    displayName: Global Background Gallery Mode
    description: When true, the Global Background Source ID is a gallery. When false, it is a tag.
    type: BOOLEAN
  performerPage:
    displayName: Unique Performer Backgrounds (optional)
    description: When true, performer pages use background images containing the current performer. If none are found, the global background is used.
    type: BOOLEAN
  performerPageId:
    displayName: Performer Source ID (optional)
    description: Optional tag or gallery ID for performer page backgrounds. If unset, the global source ID is used.
    type: NUMBER
  performerPageEntity:
    displayName: Performer Background Gallery Mode (optional)
    description: When true, the Performer Source ID is a gallery. When false, it is a tag.
    type: BOOLEAN
  slideshowDuration:
    displayName: Slideshow Duration Seconds
    description: Seconds to hold each slideshow image. Set 0 to disable slideshow mode. Positive values below 1 are treated as 1. Default 0.
    type: NUMBER
  slideshowTransitionDuration:
    displayName: Slideshow Transition Milliseconds
    description: Crossfade duration in milliseconds. Set 0 to disable fades. When slideshow is active, this is capped below the slideshow duration. Default 2000.
    type: NUMBER
  backgroundColumns:
    displayName: Background Columns
    description: Number of vertical background columns to render. 1, 2, or 3. Default 1.
    type: NUMBER
  backgroundColumnWidths:
    displayName: Column Widths
    description: Optional comma-separated column widths as percentages, or auto. Use x,x for two columns or x,x,x for three. Leave blank for equal widths.
    type: STRING
  backgroundColumnBlendWidth:
    displayName: Column Blend Width Pixels
    description: Width in pixels to softly blend seams between columns. 0 for hard edges. Default 160.
    type: NUMBER
