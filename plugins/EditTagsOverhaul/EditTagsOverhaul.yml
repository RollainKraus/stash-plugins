name: Edit Tags Overhaul
description: Hierarchical tag browser with inline search, copy/paste, and a quick tag panel overlay for scene, gallery, and image pages
version: 2.5.1
url: https://github.com/RollainKraus/stash-plugins
settings:
  defaultExpanded:
    displayName: Default Expanded
    type: BOOLEAN
    description: Expand all hierarchies by default

  autoExpandIfSelected:
    displayName: Auto Expand If Selected
    type: BOOLEAN
    description: If parent tag has child tags toggled, expand the hierarchy by default

  duplicateMultiParentTags:
    displayName: Duplicate Multi-Parent Tags
    type: BOOLEAN
    description: Allow tags with multiple parents to exist under each parent

  panelTitle:
    displayName: Panel Title
    type: STRING

  displayMode:
    displayName: Tag Display Mode
    type: STRING
    description: text, image, or imageAndText

  imageSize:
    displayName: Image Size
    type: STRING

  selectedBorderColor:
    displayName: Selected Border Color
    type: STRING

  refreshSceneUIAfterSave:
    displayName: Refresh Scene UI After Save
    type: BOOLEAN
    description: Attempt to refresh Stash's native scene page data after tag changes without a full browser reload. Default false.

  enableQuickTagPanelOverlay:
    displayName: Enable Quick Tag Panel Overlay
    type: BOOLEAN
    description: Show a floating Tags button and quick tag panel overlay on scene pages. Default true.

  autoOpenQuickTagPanelOverlay:
    displayName: Auto Open Quick Tag Panel Overlay
    type: BOOLEAN
    description: When true, automatically open the quick tag panel and tag timeline, and remember whether the Tags button was left open or closed. When false, the Tags button opens and closes overlays only for the current page session. Default false.

  quickTagPanelButtonPosition:
    displayName: Quick Tag Panel Button Position
    type: STRING
    description: topright, topleft, bottomleft, or bottomright. Default bottomright.

  quickTagPanelIdleOpacity:
    displayName: Quick Tag Panel Idle Opacity
    type: STRING
    description: Panel opacity when the mouse is not hovering over it, from 0.02 to 1. Default 0.1.

  quickTagPanelSharedHover:
    displayName: Quick Tag Panel Shared Hover
    type: BOOLEAN
    description: Hovering any quick tag panel overlay keeps all quick tag panels visible. Default false.

  enableTagTimelineOverlay:
    displayName: Enable Tag Timeline Overlay
    type: BOOLEAN
    description: Alpha feature. Show timeline marker buttons and the floating scene tag timeline overlay. Tags with an eto_timeline_tag custom field are timeline tags; colors can be edited from the Timeline Tags palette. Default false.

ui:
  javascript:
    - EditTagsOverhaul.js
  css:
    - EditTagsOverhaul.css
